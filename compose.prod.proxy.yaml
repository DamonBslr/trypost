# Optional Caddy reverse proxy with automatic HTTPS (Let's Encrypt).
#
# Do not use this file on Coolify — Coolify already proxies the `app`
# service. Coolify ignores Compose `profiles` and will start Caddy anyway,
# then Caddy exits because host ports 80/443 are already taken.
#
# Standalone (no Coolify):
#   1. Point the domain's DNS at this host.
#   2. Set APP_DOMAIN and APP_URL to https://<that domain>.
#   3. docker compose -f compose.prod.yaml -f compose.prod.proxy.yaml up -d
#
# Without this overlay, uncomment `ports` on `app` in compose.prod.yaml
# to serve http://localhost:8000.

services:
  caddy:
    image: caddy:2-alpine
    container_name: trypost-caddy
    restart: unless-stopped
    environment:
      APP_DOMAIN: "${APP_DOMAIN:-post.example.com}"
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - app

volumes:
  caddy-data:
  caddy-config:
