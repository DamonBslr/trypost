# TryPost — self-hosted production stack.
#
# Values come from the environment: a `.env` file next to this compose file
# (copy `.env.production.example`) or your platform's Environment Variables
# UI. Coolify reads every `${VAR}` below and creates a matching field.
#
#   1. Generate secrets once:
#        docker run --rm ghcr.io/trypostit/trypost:latest php artisan key:generate --show
#        docker run --rm ghcr.io/trypostit/trypost:latest php artisan passport:keys --show
#   2. Set APP_KEY, PASSPORT_PRIVATE_KEY, PASSPORT_PUBLIC_KEY, DB_PASSWORD,
#      and APP_URL in `.env` or Coolify. Enable Multiline on the Passport keys
#      in Coolify (or paste them as a single line with literal \n).
#   3. Copy `.env.production.example` to `.env` (Compose reads that name for
#      interpolation and passes it into the app container). Then:
#        docker compose -f compose.prod.yaml up -d
#      On Coolify: Build Pack = Docker Compose, Compose Location =
#      compose.prod.yaml, then fill Environment Variables and deploy.
#      Coolify writes its own `.env` — do not reuse a development Laravel
#      `.env` (it points DB_HOST at 127.0.0.1).
#
# This pulls the published image — no local build. Postgres, Redis, the queue
# workers, the scheduler and the WebSocket server all run for you.

services:
  app:
    image: ghcr.io/trypostit/trypost:latest
    container_name: trypost
    restart: unless-stopped
    # Any extra Coolify / .env key reaches Laravel without editing this file.
    env_file:
      - .env
    environment:
      # ===== Required =====
      APP_NAME: "${APP_NAME:-TryPost}"
      APP_ENV: "${APP_ENV:-production}"
      APP_DEBUG: "${APP_DEBUG:-false}"
      APP_KEY: "${APP_KEY:?APP_KEY is required}"
      # Coolify fills SERVICE_URL_APP from the domain assigned to this service.
      APP_URL: "${APP_URL:-${SERVICE_URL_APP:-http://localhost:8000}}"
      SELF_HOSTED: "${SELF_HOSTED:-true}"
      TRYPOST_TARGET: production

      # ===== Database (bundled postgres service below) =====
      DB_CONNECTION: "${DB_CONNECTION:-pgsql}"
      DB_HOST: "${DB_HOST:-pgsql}"
      DB_PORT: "${DB_PORT:-5432}"
      DB_DATABASE: "${DB_DATABASE:-trypost}"
      DB_USERNAME: "${DB_USERNAME:-trypost}"
      DB_PASSWORD: "${DB_PASSWORD:?DB_PASSWORD is required}"

      # ===== Redis / queue / cache / broadcasting =====
      REDIS_HOST: "${REDIS_HOST:-redis}"
      REDIS_PORT: "${REDIS_PORT:-6379}"
      QUEUE_CONNECTION: "${QUEUE_CONNECTION:-redis}"
      CACHE_STORE: "${CACHE_STORE:-redis}"
      SESSION_DRIVER: "${SESSION_DRIVER:-database}"
      BROADCAST_CONNECTION: "${BROADCAST_CONNECTION:-reverb}"

      # ===== WebSockets (Reverb) =====
      # The published image bakes the client at localhost:8080. For a custom
      # domain, rebuild the image with --build-arg VITE_REVERB_HOST=<domain>
      # VITE_REVERB_PORT=443 VITE_REVERB_SCHEME=https.
      REVERB_APP_ID: "${REVERB_APP_ID:-1001}"
      REVERB_APP_KEY: "${REVERB_APP_KEY:-trypost-reverb-key}"
      REVERB_APP_SECRET: "${REVERB_APP_SECRET:-change-me-reverb-secret}"
      REVERB_HOST: "${REVERB_HOST:-localhost}"
      REVERB_PORT: "${REVERB_PORT:-8080}"
      REVERB_SCHEME: "${REVERB_SCHEME:-http}"

      # ===== Passport (OAuth / API keys / MCP) =====
      # REQUIRED for any durable deploy (and always for multi-node / load
      # balancers). File keys under storage/ are NOT persisted by the volumes
      # below — without these env vars a container recreate issues new keys and
      # invalidates every API/MCP token.
      PASSPORT_PRIVATE_KEY: "${PASSPORT_PRIVATE_KEY:?PASSPORT_PRIVATE_KEY is required}"
      PASSPORT_PUBLIC_KEY: "${PASSPORT_PUBLIC_KEY:?PASSPORT_PUBLIC_KEY is required}"

      # ===== Storage =====
      FILESYSTEM_DISK: "${FILESYSTEM_DISK:-public}"
      # Cloudflare R2: set FILESYSTEM_DISK=r2
      R2_ACCESS_KEY_ID: "${R2_ACCESS_KEY_ID:-}"
      R2_SECRET_ACCESS_KEY: "${R2_SECRET_ACCESS_KEY:-}"
      R2_ENDPOINT: "${R2_ENDPOINT:-}"
      R2_BUCKET: "${R2_BUCKET:-}"
      R2_URL: "${R2_URL:-}"
      # AWS S3: set FILESYSTEM_DISK=s3
      AWS_ACCESS_KEY_ID: "${AWS_ACCESS_KEY_ID:-}"
      AWS_SECRET_ACCESS_KEY: "${AWS_SECRET_ACCESS_KEY:-}"
      AWS_DEFAULT_REGION: "${AWS_DEFAULT_REGION:-us-east-1}"
      AWS_BUCKET: "${AWS_BUCKET:-}"
      AWS_URL: "${AWS_URL:-}"

      # ===== Mail =====
      MAIL_MAILER: "${MAIL_MAILER:-log}"
      MAIL_FROM_ADDRESS: "${MAIL_FROM_ADDRESS:-hello@example.com}"
      MAIL_FROM_NAME: "${MAIL_FROM_NAME:-TryPost}"
      MAIL_HOST: "${MAIL_HOST:-}"
      MAIL_PORT: "${MAIL_PORT:-}"
      MAIL_USERNAME: "${MAIL_USERNAME:-}"
      MAIL_PASSWORD: "${MAIL_PASSWORD:-}"
      MAIL_SCHEME: "${MAIL_SCHEME:-}"

      # ===== Social platforms =====
      # Redirect URI in each portal: <APP_URL>/accounts/<platform>/callback
      LINKEDIN_CLIENT_ID: "${LINKEDIN_CLIENT_ID:-}"
      LINKEDIN_CLIENT_SECRET: "${LINKEDIN_CLIENT_SECRET:-}"
      X_CLIENT_ID: "${X_CLIENT_ID:-}"
      X_CLIENT_SECRET: "${X_CLIENT_SECRET:-}"
      FACEBOOK_CLIENT_ID: "${FACEBOOK_CLIENT_ID:-}"
      FACEBOOK_CLIENT_SECRET: "${FACEBOOK_CLIENT_SECRET:-}"
      INSTAGRAM_CLIENT_ID: "${INSTAGRAM_CLIENT_ID:-}"
      INSTAGRAM_CLIENT_SECRET: "${INSTAGRAM_CLIENT_SECRET:-}"
      THREADS_CLIENT_ID: "${THREADS_CLIENT_ID:-}"
      THREADS_CLIENT_SECRET: "${THREADS_CLIENT_SECRET:-}"
      TIKTOK_CLIENT_ID: "${TIKTOK_CLIENT_ID:-}"
      TIKTOK_CLIENT_SECRET: "${TIKTOK_CLIENT_SECRET:-}"
      PINTEREST_CLIENT_ID: "${PINTEREST_CLIENT_ID:-}"
      PINTEREST_CLIENT_SECRET: "${PINTEREST_CLIENT_SECRET:-}"
      GOOGLE_CLIENT_ID: "${GOOGLE_CLIENT_ID:-}"
      GOOGLE_CLIENT_SECRET: "${GOOGLE_CLIENT_SECRET:-}"

      # ===== AI (optional — leave blank to disable AI features) =====
      OPENAI_API_KEY: "${OPENAI_API_KEY:-}"
      ANTHROPIC_API_KEY: "${ANTHROPIC_API_KEY:-}"
      GEMINI_API_KEY: "${GEMINI_API_KEY:-}"
      OPENROUTER_API_KEY: "${OPENROUTER_API_KEY:-}"
      ELEVENLABS_API_KEY: "${ELEVENLABS_API_KEY:-}"
    ports:
      - "${APP_PORT:-8000}:80"
      - "${REVERB_PORT:-8080}:8080"
    volumes:
      - storage:/var/www/html/storage/app
    depends_on:
      pgsql:
        condition: service_healthy
      redis:
        condition: service_healthy

  pgsql:
    image: postgres:16-alpine
    container_name: trypost-pgsql
    restart: unless-stopped
    environment:
      POSTGRES_DB: "${DB_DATABASE:-trypost}"
      POSTGRES_USER: "${DB_USERNAME:-trypost}"
      POSTGRES_PASSWORD: "${DB_PASSWORD:?DB_PASSWORD is required}"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${DB_USERNAME:-trypost} -d ${DB_DATABASE:-trypost}']
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: trypost-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redisdata:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 3s
      retries: 5

  # Optional reverse proxy with automatic HTTPS (Let's Encrypt).
  # Skip this on Coolify — Coolify already proxies the app service.
  # To serve on a domain without Coolify:
  #   1. Point the domain's DNS at this host.
  #   2. Set APP_DOMAIN and APP_URL to https://<that domain>.
  #   3. Start with the proxy profile:
  #        docker compose -f compose.prod.yaml --profile proxy up -d
  # Without the profile, the app is served directly on http://localhost:8000.
  caddy:
    image: caddy:2-alpine
    container_name: trypost-caddy
    restart: unless-stopped
    profiles: [proxy]
    environment:
      APP_DOMAIN: "${APP_DOMAIN:-${SERVICE_FQDN_APP:-post.example.com}}"
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - app

volumes:
  pgdata:
  redisdata:
  storage:
  caddy-data:
  caddy-config:
